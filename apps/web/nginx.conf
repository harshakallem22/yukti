server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: unknown paths resolve to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE needs buffering off and no read timeout, or the live run stream is
        # chopped up and then killed during a long test run.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
