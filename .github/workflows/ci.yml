name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy core agent tools guardrails sandbox evals yukti_mcp

      - name: Tests
        # Runs against the scripted provider — no key, no network, no spend.
        env:
          YUKTI_MODEL_PROVIDER: fake
        run: pytest -q

      - name: Security tests must not be skipped
        env:
          YUKTI_MODEL_PROVIDER: fake
        run: pytest -q -m security --no-header

  eval-smoke:
    name: Evaluation harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Benchmarks are well-formed
        # Every case must fail its hidden tests before a fix. A benchmark that
        # passes when broken silently inflates every future task-success number.
        run: python scripts/check_benchmarks.py

      - name: Harness runs end to end
        # Deterministic: scripted provider, no model spend. Real LLM evaluations
        # are run manually, not on every commit.
        env:
          YUKTI_MODEL_PROVIDER: fake
        run: python -m evals.run --case fastapi-bug-001 --allow-demo

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
